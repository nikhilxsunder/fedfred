[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedfred"
version = "4.0.0"
description = "A feature-rich python package for interacting with the Federal Reserve Bank of St. Louis Economic Database: FRED"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nikhil Sunder", email = "nsunder724@gmail.com" }
]
requires-python = ">=3.10,<4.0"
keywords = [
    "fred", "federal reserve", "api", "economics", "finance", "economic data", "financial data",
    "fred pandas", "fred polars", "fred dask", "fred geopandas", "async", "pandas", "polars",
    "dask", "geopandas", "cache", "financial analysis", "economic analysis", "data analysis",
    "data science", "data visualization", "data mining", "data wrangling", "data cleaning"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment"
]
dependencies = [
    "httpx",
    "cachetools",
    "asyncache",
    "tenacity",
    "pandas",
    "geopandas",
]

[project.optional-dependencies]
types  = ["pandas-stubs", "types-cachetools", "types-geopandas"]
dask   = ["dask", "dask-geopandas"]
polars = ["polars", "polars-st"]

[project.urls]
Repository    = "https://github.com/nikhilxsunder/fedfred"
Documentation = "https://nikhilxsunder.github.io/fedfred/"

[dependency-groups]
dev = [
    "pandas-stubs",
    "types-cachetools",
    "types-geopandas",
    "polars",
    "polars-st",
    "dask",
    "dask-geopandas",
    "pytest",
    "pytest-cov",
    "pylint",
    "mypy",
    "bandit",
    "pip-audit",
    "pre-commit",
    "hypothesis",
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "linkify-it-py",
    "sphinxcontrib-googleanalytics",
    "tox",
    "pytest-asyncio",
    "pytest-mock",
    "tomli",
    "sphinx-sitemap",
    "sphinxext-opengraph",
    "matplotlib",
    "toml",
    "ipykernel>=7.2.0",
    "notebook>=7.5.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fedfred"]

# ── tool configs below are unchanged except the mypy fix noted below ──────────

[tool.mypy]
files = "src/fedfred"          # was "fedfred" — wrong for src layout
ignore_missing_imports = true

[tool.pylint]
max-line-length = 400
disable = ["C0302"]
ignore-patterns = [".*\\.pyi$"]

[tool.bandit]
exclude_dirs = ["tests", "docs"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = "src"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
