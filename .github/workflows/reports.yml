name: Reports
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    runs-on: ubuntu-latest

    env:
      FEDFRED_SRC: "src/fedfred"
      FEDFRED_TESTS: "tests"
      REPORT_DIR: "reports/sonar"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group lint

      - name: Create report directory
        run: mkdir -p "${REPORT_DIR}"

      - name: Pytest with coverage
        run: |
          uv run pytest \
            --cov="${FEDFRED_SRC}" \
            --cov-report=term-missing \
            --cov-report=xml:"${REPORT_DIR}/coverage.xml"

      - name: Pylint
        run: |
          uv run pylint "${FEDFRED_SRC}" "${FEDFRED_TESTS}" \
            --output-format=parseable \
            > "${REPORT_DIR}/pylint.txt" || true

      - name: MyPy
        run: |
          uv run mypy "${FEDFRED_SRC}" "${FEDFRED_TESTS}" \
            --no-pretty \
            --show-column-numbers \
            --show-error-codes \
            > "${REPORT_DIR}/mypy.txt" || true

      - name: Bandit
        run: |
          uv run bandit -r "${FEDFRED_SRC}" \
            -f json \
            -o "${REPORT_DIR}/bandit.json" || true
