name: Tests and Coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests with coverage
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests --disable-warnings --cov=src --cov-report=xml --cov-report=term 2>&1 | tee coverage_output.txt

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          name: fedfred-coverage
          verbose: true

      - name: Extract coverage percentage
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          COVERAGE=$(grep "TOTAL" coverage_output.txt | awk '{print $NF}' | sed 's/%//')
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

      - name: Update TEST_COVERAGE.md
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          DATE=$(date +"%Y-%m-%d")
          cat > TEST_COVERAGE.md << EOF
          # Test Coverage Report

          Last updated: $DATE

          ## Coverage Summary

          Overall coverage: ${COVERAGE}%

          ## Detailed Coverage

          \`\`\`
          $(cat coverage_output.txt)
          \`\`\`

          ## Running Test Coverage Locally

          To run the test suite with coverage:

          \`\`\`bash
          pytest --cov=src/fedfred tests/
          \`\`\`

          For a detailed HTML report:

          \`\`\`bash
          pytest --cov=src/fedfred tests/ --cov-report=html
          \`\`\`

          Then open \`htmlcov/index.html\` in your browser to view the report.

          ## Coverage Goals

          - Maintain at least 80% overall coverage
          - All public APIs should have 100% coverage
          - Focus on testing edge cases and error conditions
          EOF

      - name: Commit changes
        if: matrix.python-version == '3.13' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add TEST_COVERAGE.md
          git commit -m "Update test coverage report" || echo "No changes to commit"
          git push
